<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboard Intern - InternSpect</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-bold-straight/css/uicons-bold-straight.css'>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="fi fi-bs-rocket-lunch"></i></div>
        <div class="sidebar-brand-text">
          <div class="brand-name">InternSpect</div>
          <div class="brand-sub">Manager Portal</div>
        </div>
      </div>
      <div class="sidebar-user">
        <div id="user-avatar-slot"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name-label">Loading...</div>
          <div class="sidebar-user-role">Manager</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main Menu</div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie nav-icon"></i> Overview</a>
        <a href="interns.html" class="nav-item"><i class="fa-solid fa-users nav-icon"></i> Interns</a>
        <a href="add-intern.html" class="nav-item active"><i class="fa-solid fa-user-plus nav-icon"></i> Register
          Intern</a>
        <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check nav-icon"></i> Task Management</a>
        <a href="review-queue.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left nav-icon"></i> Review
          Queue</a>
        <a href="reports.html" class="nav-item"><i class="fa-solid fa-file-lines nav-icon"></i> Daily Reports</a>
        <div class="nav-section-label">Account</div>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-gear nav-icon"></i> Profile Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="nav-item" onclick="Auth.logout()"><i class="fa-solid fa-right-from-bracket nav-icon"></i>
          Logout</a>
      </div>
    </aside>

    <header class="topbar">
      <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1 class="topbar-title">Intern Onboarding</h1>
        <div class="topbar-subtitle">Register New Intern</div>
      </div>
    </header>

    <main class="main-content">
      <div style="max-width: 800px; margin: 0 auto;">

        <div class="card">
          <form id="onboard-form" onsubmit="handleRegisterIntern(event)">
            <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1.25rem;">
              <i class="fa-solid fa-id-card" style="color: var(--primary);"></i> Intern Personal Details
            </h3>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="full-name">Full Name <span>*</span></label>
                <input type="text" id="full-name" class="form-control" placeholder="e.g. Sarah Tan Wei Ling" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="email">Email Address <span>*</span></label>
                <input type="email" id="email" class="form-control" placeholder="e.g. sarah.tan@student.utm.my"
                  required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="password">Password <span>*</span></label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="phone">Phone Number <span>*</span></label>
                <input type="tel" id="phone" class="form-control" placeholder="e.g. +60 12-345 6789" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="university">University / Institution <span>*</span></label>
                <input type="text" id="university" class="form-control" placeholder="e.g. Universiti Teknologi Malaysia"
                  required>
              </div>

              <div class="form-group">
                <label class="form-label" for="course">Course / Field of Study <span>*</span></label>
                <input type="text" id="course" class="form-control" placeholder="e.g. Bachelor of Software Engineering"
                  required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="photo-upload">Profile Photo Upload (Optional)</label>
              <input type="file" id="photo-upload" class="form-control" accept="image/*" onchange="previewPhoto(this)">
              <div id="photo-preview" style="margin-top: 0.5rem;"></div>
            </div>


            <hr style="border: 0; border-top: 1px solid var(--border-light); margin: 1.5rem 0;">

            <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1.25rem;">
              <i class="fa-solid fa-calendar-days" style="color: var(--primary);"></i> Internship Duration
            </h3>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="start-date">Start Date <span>*</span></label>
                <input type="date" id="start-date" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="end-date">End Date <span>*</span></label>
                <input type="date" id="end-date" class="form-control" required>
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
              <a href="interns.html" class="btn btn-ghost">Cancel</a>
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-user-check"></i> Register
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/automation.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let user;
    let uploadedPhotoBase64 = '';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!await Auth.requireRole('manager')) return;
      user = Auth.currentUser();
      document.getElementById('user-name-label').textContent = user.name;
      document.getElementById('user-avatar-slot').innerHTML = Utils.avatarHtml(user, 36);

      const today = new Date();
      const threeMonthsLater = new Date();
      threeMonthsLater.setMonth(today.getMonth() + 3);
      document.getElementById('start-date').value = today.toISOString().split('T')[0];
      document.getElementById('end-date').value = threeMonthsLater.toISOString().split('T')[0];
    });

    async function previewPhoto(input) {
      if (input.files && input.files[0]) {
        const valRes = Utils.validateFile(input.files[0]);
        if (!valRes.valid) {
          Utils.toast(valRes.message, 'error');
          input.value = '';
          return;
        }
        uploadedPhotoBase64 = await Utils.fileToBase64(input.files[0]);
        document.getElementById('photo-preview').innerHTML = `<img src="${uploadedPhotoBase64}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);">`;
      }
    }

    async function handleRegisterIntern(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const fullName = document.getElementById('full-name').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const university = document.getElementById('university').value.trim();
      const course = document.getElementById('course').value.trim();

      if (DB.Users.findByEmail(email)) {
        Utils.toast(`An account with email ${email} already exists.`, 'error');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await DB.Interns.create({
          name: fullName,
          email: email,
          password: password,
          phone: phone,
          photo: uploadedPhotoBase64,
          university: university,
          course: course,
          startDate: document.getElementById('start-date').value,
          endDate: document.getElementById('end-date').value,
        });

        Utils.toast(`🎉 Intern ${fullName} successfully registered! Task 1 & 2 assigned automatically.`, 'success', 4000);

        setTimeout(() => {
          window.location.href = 'interns.html';
        }, 1200);
      } catch (err) {
        Utils.toast(err.message || 'Registration failed', 'error');
        submitBtn.disabled = false;
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>

</html>
